 <style>
    body{
      background-color: #8a2846;

<body>

  <h1>Our School Clubs</h1>
  <div class="container">
    <div class="row">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="club-card">
          <h3>Music Club</h3>
          <p>We practice instruments together and prepare performances for school events.</p>
        </div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="club-card">
          <h3>Nature Club</h3>
          <p>We explore plants,animals,and the environment around our school campus.</p>
        </div>
      </div>
      <div class="col-12 col-md-12 col-lg-4">
        <div class="club-card">
